name: tests-and-wheel
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Deterministic contracts (live MySQL remains unverified)
        run: uv run --frozen python scripts/validation/release_gate.py --profile fast --source src --output /tmp/contracts-fast
      - name: Contract status and skipped cases
        if: always()
        shell: bash
        run: |
          if test -f /tmp/contracts-fast/summary.md; then
            cat /tmp/contracts-fast/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Contract gate UNVERIFIED: no report was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain deterministic contract report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts-fast
          path: /tmp/contracts-fast/
          if-no-files-found: warn
      - run: uv run --frozen pyright
      - run: uv build
      - name: Verify installed wheel outside repository
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/server-requirements.txt > /dev/null
          uv venv /tmp/sql-safety-wheel
          uv pip sync --python /tmp/sql-safety-wheel/bin/python /tmp/server-requirements.txt
          uv pip install --python /tmp/sql-safety-wheel/bin/python --no-deps dist/*.whl
          /tmp/sql-safety-wheel/bin/python scripts/verify_installed.py
